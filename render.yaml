services:
  - type: web
    name: reservation-demo
    runtime: docker
    plan: free
    region: singapore
    rootDir: rust/reservation
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    # GitHub Actionsの検査が成功したときだけ公開する
    autoDeployTrigger: checksPass
    envVars:
      # 送信元をプロキシのヘッダーから取る
      - key: TRUST_PROXY
        value: "1"
