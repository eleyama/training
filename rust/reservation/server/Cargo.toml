[package]
name = "reservation-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
reservation-core = { version = "0.1.0", path = "../core" }
rusqlite = { version = "0.41.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["set-header", "timeout"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
